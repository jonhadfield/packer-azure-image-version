name: goreleaser

on:
  push:
    tags:
      - '*'

# Publishing a GitHub release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        # Build with the Go that go.mod asks for, rather than a hard-coded
        # version that falls behind every time a dependency raises it.
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Track GoReleaser v2 but not a future v3, whose breaking changes
          # would otherwise land on the next tag unannounced.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
